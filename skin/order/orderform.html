<!--@layout(/layout/basic/layout.html)-->
<!--
    LUMEN — 주문서 작성 (구조 + 스타일 훅)
    ─────────────────────────────────────────────────────────────
    주문서는 결제·배송지·할인·약관 로직이 카페24 스크립트와 깊게 연결되어 있어
    "새로 만들기"보다 "기본 스킨을 감싸기"가 안전합니다.

    적용 방법
      1) 기본 스킨의 order/orderform.html 을 열어 본문 전체를 복사합니다.
      2) 아래 [MERGE-1] ~ [MERGE-4] 위치에 해당 영역을 붙여 넣습니다.
         (모듈 div · {$form.*} · onclick · id 는 절대 수정하지 마세요)
      3) LUMEN 스타일은 .lm-order 하위의 기본 클래스(ec-base-table, btnSubmit 등)에
         자동 적용됩니다 (css/lumen.pages.css 'ORDER FORM' 구역).
    ─────────────────────────────────────────────────────────────
-->
<div class="lm-container">
    <header class="lm-cart-head">
        <h1>Checkout<small>주문서 작성</small></h1>
        <ol class="lm-steps" aria-label="주문 단계">
            <li><b>01</b> 장바구니</li>
            <li aria-current="step"><b>02</b> 주문서 작성</li>
            <li><b>03</b> 주문 완료</li>
        </ol>
    </header>

    <!-- CHECK: 주문서 최상위 모듈명(Order_form / Order_orderform)과 form 태그 위치는 기본 스킨 그대로 사용 -->
    <div module="Order_form" class="lm-order">
        <div class="lm-order__main">

            <!-- [MERGE-1] 주문 상품 목록 -->
            <section class="lm-order__section" aria-labelledby="lmOrderProducts">
                <h2 class="lm-order__title" id="lmOrderProducts">주문 상품</h2>
                <div class="lm-order__slot">
                    <!-- 기본 스킨의 주문상품 테이블(Order_normallist 등)을 여기에 붙여 넣으세요 -->
                </div>
            </section>

            <!-- [MERGE-2] 주문자 / 배송지 정보 -->
            <section class="lm-order__section" aria-labelledby="lmOrderAddress">
                <h2 class="lm-order__title" id="lmOrderAddress">배송지 <small><span class="lm-text-accent">*</span> 필수 입력</small></h2>
                <div class="lm-order__slot ec-base-table">
                    <!-- 기본 스킨의 주문자 정보 · 배송 정보 테이블을 여기에 붙여 넣으세요 -->
                </div>
            </section>

            <!-- [MERGE-3] 할인 / 적립금 / 결제수단 -->
            <section class="lm-order__section" aria-labelledby="lmOrderPayment">
                <h2 class="lm-order__title" id="lmOrderPayment">할인 · 결제수단</h2>
                <div class="lm-order__slot ec-base-table">
                    <!-- 기본 스킨의 할인/부가결제(쿠폰·적립금) · 결제수단 영역을 여기에 붙여 넣으세요 -->
                </div>
            </section>
        </div>

        <!-- [MERGE-4] 최종 결제 금액 + 약관 동의 + 결제하기 버튼 -->
        <aside class="lm-order__aside" aria-labelledby="lmOrderTotal">
            <div class="lm-summary">
                <h2 class="lm-summary__title" id="lmOrderTotal">최종 결제 금액</h2>
                <div class="lm-order__slot">
                    <!-- 기본 스킨의 최종 결제금액 표 · 구매 동의 체크 · 결제하기(btnSubmit) 버튼을 여기에 붙여 넣으세요 -->
                </div>
                <p class="lm-summary__note">주문 내용을 확인했으며 결제에 동의합니다. (전자상거래법 제8조 제2항)</p>
            </div>
        </aside>
    </div>
    <div style="height:var(--section-gap)"></div>
</div>
